<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phantech Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; }
    nav { background: #1a1a2e; color: white; padding: 16px 24px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    nav button { width: auto; padding: 8px 16px; font-size: 13px; }
    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; cursor: pointer; background: #ddd; border-radius: 6px; font-weight: bold; }
    .tab.active { background: #1a1a2e; color: white; }
    .section { display: none; }
    .section.active { display: block; }
    .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    input, select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; width: 100%; margin-bottom: 10px; }
    .duration-row { display: flex; gap: 10px; }
    .duration-row select { width: 140px; flex-shrink: 0; }
    .duration-row input { flex: 1; }
    button { padding: 10px 20px; background: #1a1a2e; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button.danger { background: #e74c3c; }
    button.warning { background: #f39c12; }
    button.small { padding: 6px 12px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9f9f9; font-weight: bold; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .badge.active { background: #d4edda; color: #155724; }
    .badge.inactive { background: #f8d7da; color: #721c24; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; align-items: center; justify-content: center; }
    .modal.open { display: flex; }
    .modal-box { background: white; border-radius: 10px; padding: 28px; width: 100%; max-width: 400px; }
    .modal-box h3 { margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 10px; }

    /* Login screen */
    #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1a1a2e; }
    #login-box { background: white; border-radius: 12px; padding: 32px; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    #login-box h2 { text-align: center; margin-bottom: 20px; color: #1a1a2e; }
    #login-error { color: #e74c3c; font-size: 13px; text-align: center; margin-bottom: 10px; min-height: 18px; }
    #admin-app { display: none; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div id="login-box">
      <h2>Phantech Admin</h2>
      <div id="login-error"></div>
      <input id="login-username" placeholder="Username" autocomplete="username" />
      <input id="login-password" placeholder="Password" type="password" autocomplete="current-password" />
      <button onclick="login()">Login</button>
    </div>
  </div>

  <!-- ADMIN APP (hidden until logged in) -->
  <div id="admin-app">
    <nav>
      <span>Phantech — Admin</span>
      <button onclick="logout()">Logout</button>
    </nav>
    <div class="container">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('packages', this)">Packages</div>
        <div class="tab" onclick="switchTab('tenants', this)">Tenants</div>
        <div class="tab" onclick="switchTab('payments', this)">Payments</div>
      </div>

      <div id="packages" class="section active">
        <div class="card">
          <h3 style="margin-bottom:16px">Add Package</h3>
          <input id="p-name" placeholder="Package Name (e.g. 15 Minutes, Monthly)" />
          <div class="duration-row">
            <select id="p-type" onchange="updateDurationRange()">
              <option value="minutes">Minutes</option>
              <option value="days" selected>Days</option>
            </select>
            <input id="p-duration" placeholder="Duration" type="number" min="1" max="30" />
          </div>
          <input id="p-price" placeholder="Price (KES)" type="number" />
          <button onclick="addPackage()">Add Package</button>
        </div>
        <div class="card">
          <h3 style="margin-bottom:16px">All Packages</h3>
          <table>
            <thead><tr><th>Name</th><th>Duration</th><th>Price (KES)</th><th>Actions</th></tr></thead>
            <tbody id="package-list"></tbody>
          </table>
        </div>
      </div>

      <div id="tenants" class="section">
        <div class="card">
          <h3 style="margin-bottom:16px">All Tenants</h3>
          <table>
            <thead><tr><th>Name</th><th>Phone</th><th>Router</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="tenant-list"></tbody>
          </table>
        </div>
      </div>

      <div id="payments" class="section">
        <div class="card">
          <h3 style="margin-bottom:16px">All Payments</h3>
          <table>
            <thead><tr><th>Tenant</th><th>Amount</th><th>M-Pesa Code</th><th>Status</th><th>Date</th></tr></thead>
            <tbody id="payment-list"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="modal" id="edit-modal">
      <div class="modal-box">
        <h3>Edit Package</h3>
        <input id="edit-name" placeholder="Package Name" />
        <div class="duration-row">
          <select id="edit-type" onchange="updateEditDurationRange()">
            <option value="minutes">Minutes</option>
            <option value="days">Days</option>
          </select>
          <input id="edit-duration" placeholder="Duration" type="number" min="1" max="30" />
        </div>
        <input id="edit-price" placeholder="Price (KES)" type="number" />
        <input type="hidden" id="edit-id" />
        <div class="modal-actions">
          <button onclick="saveEdit()">Save</button>
          <button class="danger" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";
    let token = null; // kept in memory only, never in localStorage

    function authHeaders(extra = {}) {
      return { ...extra, "Authorization": `Bearer ${token}` };
    }

    async function login() {
      const username = document.getElementById("login-username").value;
      const password = document.getElementById("login-password").value;
      const errorEl = document.getElementById("login-error");
      errorEl.textContent = "";

      if (!username || !password) {
        errorEl.textContent = "Enter username and password.";
        return;
      }

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          errorEl.textContent = "Invalid username or password.";
          return;
        }

        const data = await res.json();
        token = data.token;
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("admin-app").style.display = "block";
        loadPackages();
      } catch (e) {
        errorEl.textContent = "Could not reach server. Is the backend running?";
      }
    }

    function logout() {
      token = null;
      document.getElementById("admin-app").style.display = "none";
      document.getElementById("login-screen").style.display = "flex";
      document.getElementById("login-username").value = "";
      document.getElementById("login-password").value = "";
    }

    function updateDurationRange() {
      const type = document.getElementById("p-type").value;
      const input = document.getElementById("p-duration");
      input.max = type === "minutes" ? 60 : 30;
      input.placeholder = type === "minutes" ? "1 - 60" : "1 - 30";
      input.value = "";
    }

    function updateEditDurationRange() {
      const type = document.getElementById("edit-type").value;
      const input = document.getElementById("edit-duration");
      input.max = type === "minutes" ? 60 : 30;
    }

    function switchTab(name, el) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      document.getElementById(name).classList.add("active");
      el.classList.add("active");
      if (name === "tenants") loadTenants();
      if (name === "packages") loadPackages();
      if (name === "payments") loadPayments();
    }

    function handleAuthError(res) {
      if (res.status === 401) {
        alert("Session expired. Please log in again.");
        logout();
        return true;
      }
      return false;
    }

    async function loadPackages() {
      const res = await fetch(`${API}/packages/`);
      const data = await res.json();
      const tbody = document.getElementById("package-list");
      tbody.innerHTML = "";
      data.forEach(p => {
        const durLabel = p.duration_type === "minutes" ? `${p.duration_days} min` : `${p.duration_days} days`;
        tbody.innerHTML += `
          <tr>
            <td>${p.name}</td>
            <td>${durLabel}</td>
            <td>KES ${p.price}</td>
            <td>
              <button class="warning small" onclick="openEdit(${p.id}, '${p.name}', ${p.duration_days}, ${p.price}, '${p.duration_type}')">Edit</button>
              <button class="danger small" onclick="deletePackage(${p.id})">Delete</button>
            </td>
          </tr>`;
      });
    }

    async function addPackage() {
      const name = document.getElementById("p-name").value;
      const duration = document.getElementById("p-duration").value;
      const price = document.getElementById("p-price").value;
      const type = document.getElementById("p-type").value;
      if (!name || !duration || !price) { alert("Fill in all fields."); return; }
      const res = await fetch(`${API}/packages/?name=${encodeURIComponent(name)}&duration_days=${duration}&price=${price}&duration_type=${type}`, {
        method: "POST",
        headers: authHeaders()
      });
      if (handleAuthError(res)) return;
      document.getElementById("p-name").value = "";
      document.getElementById("p-duration").value = "";
      document.getElementById("p-price").value = "";
      loadPackages();
    }

    async function deletePackage(id) {
      if (!confirm("Delete this package?")) return;
      const res = await fetch(`${API}/packages/${id}`, { method: "DELETE", headers: authHeaders() });
      if (handleAuthError(res)) return;
      loadPackages();
    }

    function openEdit(id, name, duration, price, type) {
      document.getElementById("edit-id").value = id;
      document.getElementById("edit-name").value = name;
      document.getElementById("edit-duration").value = duration;
      document.getElementById("edit-price").value = price;
      document.getElementById("edit-type").value = type;
      document.getElementById("edit-modal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("edit-modal").classList.remove("open");
    }

    async function saveEdit() {
      const id = document.getElementById("edit-id").value;
      const name = document.getElementById("edit-name").value;
      const duration = document.getElementById("edit-duration").value;
      const price = document.getElementById("edit-price").value;
      const type = document.getElementById("edit-type").value;
      const res = await fetch(`${API}/packages/${id}?name=${encodeURIComponent(name)}&duration_days=${duration}&price=${price}&duration_type=${type}`, {
        method: "PUT",
        headers: authHeaders()
      });
      if (handleAuthError(res)) return;
      closeModal();
      loadPackages();
    }

    async function loadTenants() {
      const res = await fetch(`${API}/tenants/`);
      const data = await res.json();
      const tbody = document.getElementById("tenant-list");
      tbody.innerHTML = "";
      data.forEach(t => {
        tbody.innerHTML += `
          <tr>
            <td>${t.name}</td>
            <td>${t.phone}</td>
            <td>${t.router_name}</td>
            <td><span class="badge ${t.is_active ? 'active' : 'inactive'}">${t.is_active ? 'Active' : 'Inactive'}</span></td>
            <td>
              <button class="${t.is_active ? 'danger' : ''} small" onclick="toggleTenant(${t.id}, ${!t.is_active})">
                ${t.is_active ? 'Disable' : 'Enable'}
              </button>
              <button class="danger small" onclick="deleteTenant(${t.id})">Delete</button>
            </td>
          </tr>`;
      });
    }

    async function toggleTenant(id, status) {
      const res = await fetch(`${API}/tenants/${id}/toggle?status=${status}`, { method: "PUT", headers: authHeaders() });
      if (handleAuthError(res)) return;
      loadTenants();
    }

    async function deleteTenant(id) {
      if (!confirm("Delete this tenant?")) return;
      const res = await fetch(`${API}/tenants/${id}`, { method: "DELETE", headers: authHeaders() });
      if (handleAuthError(res)) return;
      loadTenants();
    }

    async function loadPayments() {
      const res = await fetch(`${API}/payments/all`, { headers: authHeaders() });
      if (handleAuthError(res)) return;
      const data = await res.json();
      const tbody = document.getElementById("payment-list");
      tbody.innerHTML = "";
      data.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.tenant_name}</td>
            <td>KES ${p.amount}</td>
            <td>${p.mpesa_code || 'N/A'}</td>
            <td><span class="badge ${p.status === 'confirmed' ? 'active' : 'inactive'}">${p.status}</span></td>
            <td>${new Date(p.created_at).toLocaleDateString()}</td>
          </tr>`;
      });
    }
  </script>
</body>
</html>
