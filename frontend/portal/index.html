<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phantech Internet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: white; border-radius: 12px; padding: 32px; width: 100%; max-width: 440px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    h2 { text-align: center; margin-bottom: 6px; color: #1a1a2e; }
    p.sub { text-align: center; color: #888; margin-bottom: 24px; font-size: 14px; }
    .step { display: none; }
    .step.active { display: block; }
    input { padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; width: 100%; margin-bottom: 14px; font-size: 15px; }
    button { padding: 12px; background: #1a1a2e; color: white; border: none; border-radius: 8px; width: 100%; font-size: 15px; cursor: pointer; margin-bottom: 10px; }
    button.secondary { background: #eee; color: #333; }
    .package-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .package-item { border: 2px solid #eee; border-radius: 8px; padding: 16px; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
    .package-item:hover { border-color: #1a1a2e; background: #f9f9ff; }
    .package-item.selected { border-color: #1a1a2e; background: #f0f0f8; }
    .package-item h4 { margin-bottom: 4px; font-size: 16px; }
    .package-item span { color: #888; font-size: 13px; }
    .package-price { font-size: 18px; font-weight: bold; color: #1a1a2e; }
    .info-box { background: #f4f4f4; border-radius: 8px; padding: 14px; margin-bottom: 16px; font-size: 14px; line-height: 1.8; }
    .spinner { width: 80px; height: 80px; border: 6px solid #eee; border-top: 6px solid #1a1a2e; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">

  <div id="step-packages" class="step active">
    <h2>Hotspot Portal</h2>
    <p class="sub">Select a package to get started</p>
    <div class="package-list" id="package-list"></div>
  </div>

  <div id="step-phone" class="step">
    <h2>Enter Your Number</h2>
    <p class="sub">We'll send an M-Pesa prompt to this number</p>
    <div class="info-box" id="selected-package-summary"></div>
    <input id="phone" placeholder="Phone Number (07XXXXXXXX)" type="tel" />
    <button onclick="proceedToPayment()">Confirm & Pay</button>
    <button class="secondary" onclick="goTo('step-packages')">Back</button>
  </div>

  <div id="step-waiting" class="step">
    <h2>Waiting for Payment</h2>
    <p class="sub">Check your phone and enter your M-Pesa PIN</p>
    <div style="text-align:center; margin: 30px 0;">
      <div class="spinner"></div>
      <p id="countdown-text" style="color:#888; margin-top:20px; font-size:13px;">waiting... <span id="countdown">60</span>s</p>
    </div>
    <button class="secondary" onclick="goTo('step-packages')">Cancel</button>
  </div>

  <div id="step-success" class="step">
    <div style="text-align:center; font-size:64px; margin-bottom:16px;">✓</div>
    <h2>You're Online!</h2>
    <p class="sub">Payment confirmed</p>
    <div class="info-box" id="success-summary"></div>
    <button onclick="window.location.href='http://google.com'">Start Browsing</button>
  </div>

  <div id="step-error" class="step">
    <div style="text-align:center; font-size:64px; margin-bottom:16px;">✗</div>
    <h2>Payment Failed</h2>
    <p class="sub" id="error-msg">Something went wrong. Please try again.</p>
    <button onclick="goTo('step-packages')">Try Again</button>
  </div>

</div>

<script>
  const API = "http://127.0.0.1:8000";
  let selectedPackage = null;
  let currentTenant = null;
  let countdownTimer = null;

  function goTo(stepId) {
    document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
    document.getElementById(stepId).classList.add("active");
  }

  function formatPhone(phone) {
    phone = phone.trim();
    if (phone.startsWith("0")) return "254" + phone.slice(1);
    if (phone.startsWith("+")) return phone.slice(1);
    return phone;
  }

  async function loadPackages() {
    const res = await fetch(`${API}/packages/`);
    const packages = await res.json();
    const list = document.getElementById("package-list");
    list.innerHTML = "";
    packages.forEach(p => {
      const div = document.createElement("div");
      div.className = "package-item";
      div.innerHTML = `
        <div>
          <h4>${p.name}</h4>
          <span>${p.duration_days} day(s)</span>
        </div>
        <div class="package-price">KES ${p.price}</div>
      `;
      div.onclick = () => {
        selectedPackage = p;
        document.getElementById("selected-package-summary").innerHTML = `
          <b>Package:</b> ${p.name}<br>
          <b>Duration:</b> ${p.duration_days} day(s)<br>
          <b>Amount:</b> KES ${p.price}
        `;
        goTo("step-phone");
      };
      list.appendChild(div);
    });
  }

  async function proceedToPayment() {
    const raw = document.getElementById("phone").value.trim();
    if (!raw) { alert("Enter your phone number."); return; }
    const phone = formatPhone(raw);

    const res = await fetch(`${API}/tenants/`);
    const tenants = await res.json();
    const found = tenants.find(t => t.phone === phone || t.phone === raw);

    if (found) {
      currentTenant = found;
    } else {
      const reg = await fetch(`${API}/tenants/?name=Guest&phone=${phone}&router_name=walkin`, { method: "POST" });
      currentTenant = await reg.json();
    }

    goTo("step-waiting");
    startCountdown();

    const stkRes = await fetch(`${API}/payments/stk-push`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tenant_id: currentTenant.id,
        package_id: selectedPackage.id,
        phone: currentTenant.phone,
        amount: selectedPackage.price
      })
    });

    const data = await stkRes.json();

    if (data.checkout_request_id) {
      pollPaymentStatus(data.checkout_request_id);
    } else {
      clearInterval(countdownTimer);
      document.getElementById("error-msg").textContent = data.detail || "STK Push failed.";
      goTo("step-error");
    }
  }

  function startCountdown() {
    let seconds = 60;
    document.getElementById("countdown").textContent = seconds;
    countdownTimer = setInterval(() => {
      seconds--;
      document.getElementById("countdown").textContent = seconds;
      if (seconds <= 0) {
        clearInterval(countdownTimer);
        document.getElementById("error-msg").textContent = "Payment timed out. Please try again.";
        goTo("step-error");
      }
    }, 1000);
  }

  async function pollPaymentStatus(checkoutRequestId) {
    let attempts = 0;
    const interval = setInterval(async () => {
      attempts++;
      const res = await fetch(`${API}/payments/status/${checkoutRequestId}`);
      const data = await res.json();
      if (data.status === "confirmed") {
        clearInterval(interval);
        clearInterval(countdownTimer);
        document.getElementById("success-summary").innerHTML = `
          <b>Package:</b> ${selectedPackage.name}<br>
          <b>Duration:</b> ${selectedPackage.duration_days} day(s)<br>
          <b>Amount Paid:</b> KES ${selectedPackage.price}<br>
          <b>M-Pesa Code:</b> ${data.mpesa_code}
        `;
        goTo("step-success");
      }
      if (data.status === "failed" || attempts >= 12) {
        clearInterval(interval);
        clearInterval(countdownTimer);
        document.getElementById("error-msg").textContent = "Payment not confirmed. Try again.";
        goTo("step-error");
      }
    }, 5000);
  }

  loadPackages();
</script>
</body>
</html>
